<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotisserie Draft List</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1c1a; --muted:#6b675f; --line:#e4e0d8; --accent:#8a3b12; --row:#f3f0ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151412; --fg:#ece8e1; --muted:#9a958b; --line:#2c2a26; --accent:#e08a56; --row:#1d1c19; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p.sub { margin:0 0 16px; color:var(--muted); }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  input, select { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input { flex:1; min-width:180px; }
  .formats { display:flex; flex-wrap:wrap; gap:4px 14px; border:1px solid var(--line); border-radius:6px; margin:0 0 12px; padding:8px 12px; font-size:.9rem; }
  #qstatus:empty { display:none; }
  .formats legend { color:var(--muted); font-size:.8rem; padding:0 4px; }
  .formats label { white-space:nowrap; cursor:pointer; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:.85rem; position:sticky; top:0; background:var(--bg); }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr:hover td { background:var(--row); }
  a { color:var(--accent); text-decoration:none; }
  .r { font-size:.8rem; color:var(--muted); text-transform:capitalize; }
  .hide-sm { }
  @media (max-width: 560px) { .hide-sm { display:none; } }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  .grid a { display:block; color:var(--fg); }
  .grid img { width:100%; aspect-ratio:488/680; border-radius:5%; display:block; background:var(--row); }
  .grid .cap { display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); padding:4px 2px 0; font-variant-numeric:tabular-nums; }
  body.grid-view table, body:not(.grid-view) .grid { display:none; }
  body.grid-view main { max-width:1400px; }
  #preview { position:fixed; pointer-events:none; width:220px; border-radius:10px; display:none; box-shadow:0 6px 24px #0006; }
</style>
</head>
<body>
<main>
  <h1>Rotisserie Draft List</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="controls">
    <input id="q" type="search" placeholder="Name, or Scryfall syntax: t:creature c:r mv<=2" aria-label="Search cards">
    <select id="set" aria-label="Set"><option value="">All sets</option></select>
    <select id="view" aria-label="View"><option value="list">List</option><option value="grid">Grid</option></select>
  </div>
  <p class="sub" id="qstatus" aria-live="polite"></p>
  <fieldset id="formats" class="formats"><legend>Formats</legend></fieldset>
  <div class="grid" id="grid"></div>
  <table>
    <thead><tr><th>#</th><th>Card</th><th>Set</th><th class="hide-sm">Type</th><th class="n">Decks</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<img id="preview" alt="">
<script>
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data/ranked.json').then(r => r.json()).then(({ formats, totals, updated, cards }) => {
  const fmtBox = document.getElementById('formats');
  let on = ['ST'];
  try { on = JSON.parse(localStorage.getItem('formats')) || on; } catch {}
  fmtBox.insertAdjacentHTML('beforeend', Object.entries(formats).map(([f, label]) =>
    `<label><input type="checkbox" value="${f}" ${on.includes(f) ? 'checked' : ''}> ${label}</label>`).join(''));
  const setSel = document.getElementById('set');
  [...new Set(cards.map(c => c.set))].sort().forEach(s => setSel.add(new Option(s, s)));
  const q = document.getElementById('q'), tbody = document.getElementById('rows');
  const rank = () => {
    on = [...fmtBox.querySelectorAll('input:checked')].map(i => i.value);
    try { localStorage.setItem('formats', JSON.stringify(on)); } catch {}
    cards.forEach(c => c.decks = on.reduce((s, f) => s + (c.counts[f] ?? 0), 0));
    cards.sort((a, b) => b.decks - a.decks || a.name.localeCompare(b.name));
    cards.forEach((c, i) => c.rank = i + 1);
    const total = on.reduce((s, f) => s + totals[f], 0);
    document.getElementById('sub').textContent =
      `${cards.length} cards ranked by MTGTop8 decks (main or side) out of ${total.toLocaleString()} in the checked formats. Updated ${updated}.`;
  };
  // Scryfall-syntax queries go to the Scryfall API, scoped to the pool; plain text filters by name locally
  const BASE = '(e:MOR or e:ZEN or e:THS or e:DTK or e:EMN or e:DOM or e:IKO or e:VOW or e:WOE or e:BLB or e:FDN or e:FRA) -is:digital';
  const status = document.getElementById('qstatus');
  let match = null, seq = 0, timer;
  const isSyntax = s => /[:<>=!()"]|(^|\s)-|\bor\b/i.test(s);
  const scryfall = async () => {
    const s = q.value.trim(), id = ++seq;
    if (!isSyntax(s)) { match = null; status.textContent = ''; return render(); }
    status.textContent = 'Searching Scryfall…';
    const names = new Set();
    let url = 'https://api.scryfall.com/cards/search?unique=cards&q=' + encodeURIComponent(`(${s}) ${BASE}`);
    try {
      while (url) {
        const page = await (await fetch(url)).json();
        if (id !== seq) return;
        if (page.object === 'error') { if (page.status !== 404) throw new Error(page.details); break; }
        page.data.forEach(c => names.add(c.name));
        url = page.has_more && page.next_page;
        if (url) await new Promise(r => setTimeout(r, 100));
      }
      match = names;
      status.textContent = `${names.size} Scryfall matches`;
    } catch (e) { match = null; status.textContent = 'Scryfall: ' + e.message; }
    render();
  };
  const render = () => {
    const term = isSyntax(q.value) ? '' : q.value.trim().toLowerCase(), set = setSel.value;
    const shown = cards.filter(c => (!set || c.set === set) && (match ? match.has(c.name) : c.name.toLowerCase().includes(term)));
    const decks = c => c.decks.toLocaleString();
    if (view.value === 'grid') {
      grid.innerHTML = shown.map(c => `<a href="${c.url}" title="${esc(c.name)}"><img loading="lazy" src="${c.img}" alt="${esc(c.name)}"><div class="cap"><span>#${c.rank}</span><span>${decks(c)} decks</span></div></a>`).join('');
      return;
    }
    tbody.innerHTML = shown
      .map(c => `<tr><td class="n">${c.rank}</td><td><a href="${c.url}" data-img="${c.img}">${esc(c.name)}</a> <span class="r">${c.rarity}</span></td><td>${c.set}</td><td class="hide-sm">${esc(c.type)}</td><td class="n">${decks(c)}</td></tr>`)
      .join('');
  };
  const view = document.getElementById('view'), grid = document.getElementById('grid');
  try { view.value = localStorage.getItem('view') || 'list'; } catch {}
  view.onchange = () => { try { localStorage.setItem('view', view.value); } catch {} document.body.classList.toggle('grid-view', view.value === 'grid'); render(); };
  setSel.onchange = render;
  q.oninput = () => { clearTimeout(timer); timer = setTimeout(scryfall, isSyntax(q.value) ? 500 : 0); };
  fmtBox.onchange = () => { rank(); render(); };
  rank();
  view.onchange();
});
const pv = document.getElementById('preview');
document.addEventListener('mouseover', e => { const a = e.target.closest('a[data-img]'); if (a && a.dataset.img) { pv.src = a.dataset.img; pv.style.display = 'block'; } });
document.addEventListener('mouseout', e => { if (e.target.closest('a[data-img]')) pv.style.display = 'none'; });
document.addEventListener('mousemove', e => { pv.style.left = Math.min(e.clientX + 16, innerWidth - 236) + 'px'; pv.style.top = Math.min(e.clientY + 16, innerHeight - 320) + 'px'; });
</script>
</body>
</html>
